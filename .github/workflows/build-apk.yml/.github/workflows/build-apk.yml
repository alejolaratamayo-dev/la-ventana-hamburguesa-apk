
name: Crear APK de La Ventana

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar archivos web
        run: |
          mkdir web www
          unzip -o la-ventana-web-app-gratis-nuevo.zip -d web
          cp web/index.html www/index.html
          cp web/manifest.json www/manifest.json
          cp web/icon-192.png www/icon-192.png
          cp web/icon-512.png www/icon-512.png
          cp web/sw.js www/sw.js
          printf '{"name":"la-ventana-hamburguesa","version":"1.0.0","private":true}\n' > package.json
          printf '{"appId":"com.laventana.hamburguesa","appName":"La Ventana de la Hamburguesa","webDir":"www"}\n' > capacitor.config.json

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar archivos
        run: npx cap sync android

      - name: Construir APK
        run: cd android && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: La-Ventana-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
